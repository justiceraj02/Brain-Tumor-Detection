<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI-powered brain tumor detection using deep learning. Upload MRI scans for instant classification with a fine-tuned ResNet50 model achieving 99.3 percent accuracy.">
    <meta name="keywords" content="brain tumor detection, MRI classification, deep learning, ResNet50, medical AI">
    <title>{% block title %}Brain Tumor Detection{% endblock %} &mdash; BrainScan AI</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom Design System -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    {% block head %}{% endblock %}
</head>
<body>
    <div class="app-wrapper">

        <!-- Navbar -->
        <nav class="navbar-custom" id="main-navbar">
            <div class="container">
                <a href="{{ url_for('main') }}" class="navbar-brand" id="nav-brand">
                    <span class="brand-icon">🧠</span>
                    BrainScan AI
                </a>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <div class="container">
                {% block content %}{% endblock %}
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer-custom" id="main-footer">
            <div class="container">
                <p class="footer-text">
                    Built with PyTorch &amp; Flask by
                    <span class="highlight">Justice Raj</span>
                    &middot; For educational purposes only
                </p>
            </div>
        </footer>

    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    {% block scripts %}{% endblock %}
</body>
</html>
